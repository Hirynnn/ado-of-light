name: Publicações de mercado

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no Discord (execuções manuais são dry-run por padrão)
        required: true
        default: false
        type: boolean

concurrency:
  group: ado-of-light-market-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Consultar Universalis e publicar rankings
        run: node dist/jobs/run-publish.js
        env:
          PUBLISH_TO_DISCORD: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          UNIVERSALIS_BASE_URL: ${{ vars.UNIVERSALIS_BASE_URL }}
          XIVAPI_BASE_URL: ${{ vars.XIVAPI_BASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
